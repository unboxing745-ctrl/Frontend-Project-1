<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARRALLAX</title>

<style>
    @font-face {
        font-family: mkfont;
        src: url('https://www.dafont.com/chinese-dragon.font'),format("open font");
    }
*{
    margin :0px;
    padding: 0%;
     font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    font-family: "mkfont";
    box-sizing:content-box;
}

section{  
    width: 100%;
    height: 100vh; /* exactly one screen high */
    display: grid;
    place-items: center;
    text-align: center;
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;
}
.section{
    background-image:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3)), url("bangtan boys.jpg");
}
.section-1{
     background-image:linear-gradient(
        rgba(0,0,0,.3),rgba(0,0,0,.3)),  url("award day.jpg");
}
.section-2{
    background-image:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.1)), url("white house.jpg");
}
.section-3{
    background-image:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.1)), url("military.jpg");
}
.section-4{
    background-image:url("debut picture.jpg");
}
h2{
    font-size: 44px;
    font-weight: bold;
    text-transform: uppercase;
    color: #ffff;
    text-shadow: 2px 2px 5px #000;
}
p{
    font-size: 20px;
    color: #ffff;
}
</style>    
</head>
<body>
    <section class="section" >
        <div>
        <h2>Bangtan Boys</h2>
        </div>
    </section>
    <section class="section-4">
        <div>
            <h2>BTS Debut</h2>
            <p>Debut on 13 June 2013 </p>
        </div>
    </section>
    <section class="section-1">
        <div>
            <h2>Award Day</h2>
            <p>They won more  the 483 awards</p>
        </div>
    </section>
    <section class="section-2">
        <div>
            <h2> White house visit</h2>
            <p>BTS is first k-pop group invited in white house</p>
        </div>
    </section>
    <section class="section-3">
        <div>
         <h2>Military inlistment</h2>
         <p>They give two year to their country</p>
        </div>
    </section>
</body>
</html>
